services:
  # ====== БАЗА ДАННЫХ ======
  postgres:
    image: postgres:15-alpine
    container_name: Z-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-socialnet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - Z-network

  # ====== REDIS ======
  redis:
    image: redis:7-alpine
    container_name: Z-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - Z-network

  # ====== БЭКЕНД API ======
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Z-backend
    ports:
      - "${BACKEND_PORT:-4000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-socialnet}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@example.com}
      - AI_API_KEYS=${AI_API_KEYS:-}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-production}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - Z-network

networks:
  Z-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local