services:
  # ==========================================
  # MASTER NODE (Z-CORE)
  # ==========================================
  z-db:
    image: postgres:15-alpine
    container_name: z-db
    environment:
      POSTGRES_USER: master_user
      POSTGRES_PASSWORD: master_password
      POSTGRES_DB: z_master
    ports:
      - "5435:5432"
    volumes:
      - z_master_db_data:/var/lib/postgresql/data
    networks:
      - z-network

  z-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: z-backend
    ports:
      - "4000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Даем доступ к докеру
      - .:/app/repo # Монтируем корень репозитория для git pull
    environment:
      - DATABASE_URL=postgresql://master_user:master_password@z-db:5432/z_master
      - IS_MASTER_NODE=true
      - JWT_SECRET=${JWT_SECRET:-master_key_777}
      - AUTO_UPDATE=true
    depends_on:
      - z-db
    networks:
      - z-network

  # ==========================================
  # COMMUNITY NODE
  # ==========================================
  community-db:
    image: postgres:15-alpine
    container_name: community-db
    environment:
      POSTGRES_USER: community_user
      POSTGRES_PASSWORD: community_password
      POSTGRES_DB: z_community
    ports:
      - "5436:5432"
    volumes:
      - z_community_db_data:/var/lib/postgresql/data
    networks:
      - z-network

  community-backend:
    build:
      context: ./community
      dockerfile: Dockerfile
    container_name: community-backend
    ports:
      - "4001:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/repo
    environment:
      - DATABASE_URL=postgresql://community_user:community_password@community-db:5432/z_community
      - MASTER_NODE_URL=http://z-backend:3000
      - NODE_ID=community_1
      - AUTO_UPDATE=true
    depends_on:
      - community-db
      - z-backend
    networks:
      - z-network

networks:
  z-network:
    driver: bridge

volumes:
  z_master_db_data:
  z_community_db_data: