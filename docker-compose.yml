services:
  # ====== БАЗА ДАННЫХ ======
  postgres:
    image: postgres:15-alpine
    container_name: Z-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zzzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sAMogyg6sAMogyg}
      POSTGRES_DB: ${POSTGRES_DB:-zzzz}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zzzz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - Z-network

  # ====== REDIS ======
  redis:
    image: redis:7-alpine
    container_name: Z-redis
    ports:
      - "${REDIS_PORT:-6453}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - Z-network

  # ====== БЭКЕНД ======
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Z-backend
    ports:
      - "${BACKEND_PORT:-4000}:3000"
    command: sh -c "npx prisma db push --force-reset && npm run dev"
    volumes:
      - ./backend/src:/app/src
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zzzz}:${POSTGRES_PASSWORD:-sAMogyg6sAMogyg}@postgres:5432/${POSTGRES_DB:-zzzz}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - AI_API_KEYS=${AI_API_KEYS}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-cluster}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - IS_MASTER_NODE=${IS_MASTER_NODE:-true}
      - NODE_ID=${NODE_ID:-zzz}
      - CLUSTER_SECRET=${CLUSTER_SECRET}
      - MASTER_NODE_URL=${MASTER_NODE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - Z-network

  # ====== ФРОНТЕНД ======
  frontend:
    build:
      context: .
      dockerfile: mobile/Dockerfile
    container_name: Z-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - Z-network

networks:
  Z-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local