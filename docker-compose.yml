version: '3.8'

services:
  # ====== БАЗА ДАННЫХ ======
  postgres:
    image: postgres:15-alpine
    container_name: socialnet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - socialnet-network

  # ====== REDIS ======
  redis:
    image: redis:7-alpine
    container_name: socialnet-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - socialnet-network

  # ====== БЭКЕНД ======
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialnet-backend
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_URL=redis://redis:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - AI_API_KEYS=${AI_API_KEYS}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE}
      - AUTO_MIGRATE=${AUTO_MIGRATE}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:19000,http://frontend,http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - socialnet-network

  # ====== ФРОНТЕНД (веб-версия) ======
  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
        - VITE_APP_NAME=${VITE_APP_NAME}
    container_name: socialnet-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - socialnet-network

# ====== СЕТИ ======
networks:
  socialnet-network:
    driver: bridge

# ====== ТОМА ======
volumes:
  postgres_data:
    driver: local