services:
  postgres:
    image: postgres:15-alpine
    container_name: Z-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zzzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sAMogyg6sAMogyg}
      POSTGRES_DB: ${POSTGRES_DB:-zzzz}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zzzz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - Z-network

  redis:
    image: redis:7-alpine
    container_name: Z-redis
    ports:
      - "6453:6379"
    networks:
      - Z-network

  # Основной управляющий узел
  master-backend:
    build:
      context: ./backend-master
      dockerfile: Dockerfile
    container_name: Z-master
    ports:
      - "4000:3000"
    command: sh -c "npx prisma db push && npm run dev"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zzzz}:${POSTGRES_PASSWORD:-sAMogyg6sAMogyg}@postgres:5432/${POSTGRES_DB:-zzzz}
      - JWT_SECRET=${JWT_SECRET:-master_secret}
      - IS_MASTER_NODE=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - Z-network

  # Пример Community узла (может быть на другом сервере)
  community-backend:
    build:
      context: ./backend-community
      dockerfile: Dockerfile
    container_name: Z-community
    ports:
      - "4001:3000"
    command: sh -c "npx prisma db push && npm run dev"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zzzz}:${POSTGRES_PASSWORD:-sAMogyg6sAMogyg}@postgres:5432/${POSTGRES_DB:-zzzz}
      - MASTER_NODE_URL=http://master-backend:3000
      - IS_MASTER_NODE=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - Z-network

networks:
  Z-network:
    driver: bridge

volumes:
  postgres_data: