services:
  # ====== DATABASE (PostgreSQL) ======
  master-db:
    image: postgres:15-alpine
    container_name: Z-master-db
    environment:
      POSTGRES_USER: master_user
      POSTGRES_PASSWORD: master_password
      POSTGRES_DB: z_master
    ports:
      - "5435:5432"
    volumes:
      - master_db_data:/var/lib/postgresql/data
    networks:
      - Z-network

  # ====== STORAGE (S3/MinIO) ======
  master-s3:
    image: minio/minio:latest
    container_name: Z-master-s3
    ports:
      - "9010:9000" # API порт (изменен, чтобы не было конфликта)
      - "9011:9001" # Консоль управления
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - master_s3_data:/data
    networks:
      - Z-network

  # ====== BACKEND (Master Node) ======
  master-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Z-master-api
    ports:
      - "4000:3000"
    environment:
      - DATABASE_URL=postgresql://master_user:master_password@master-db:5432/z_master
      - IS_MASTER_NODE=true
      - JWT_SECRET=${JWT_SECRET:-master_key_777}
      - S3_ENDPOINT=http://master-s3:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
    depends_on:
      - master-db
      - master-s3
    networks:
      - Z-network

networks:
  Z-network:
    driver: bridge

volumes:
  master_db_data:
  master_s3_data: